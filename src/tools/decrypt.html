<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Decrypt Tool for Obsidian Vault Encrypted Plugin</title>
	<script src="offline-decrypt.js"></script>
	<style>
		:root{
			font-family: Arial, Helvetica, sans-serif;
		}

		body{
			display: flex;
			flex-direction: column;
			align-items: center;
			background-color: #eee;
		}

		h1{
			text-align: center;
		}

		.row-500{
			display: flex;
			flex-direction: column;
			max-width: 500px;
		}

		.col{
			display: flex;
			flex-direction: row;
			align-items: baseline;
		}

		label{
			color: blue;
			margin-top: 1em;
		}

		textarea{
			height: 5em;
			resize: vertical;
			padding: 0.5em;
		}

		button, input{
			padding: 0.5em;
		}

		#key{
			margin-right: 1em;
		}

		#m{
			margin-left: 1em;
		}

		.footnote{
			margin-top: 4em;
			font-size: 0.8em;
		}
	</style>
</head>
<body>

	<div class="row-500">
		<h1>🔐 Decrypt Tool for Obsidian Vault Encrypted Plugin 🔐</h1>

		<p>Use this tool to decrypt notes without using the Vault Encrypted plugin.</p>

		<label for="key">Private Key File (id_ed25519)</label>
		<div class="col">
			<input id="key" type="file">
			<span id="km"></span>
		</div>

		<label for="et">Encrypted Text</label>
		<textarea id="et"></textarea>

		<label for="dt">Decrypted Text</label>
		<div class="col">
			<button id="btnDecrypt" type="button">🔓 Decrypt</button>
			<span id="m"></span>
		</div>
		<textarea id="dt" readonly=""></textarea>

		<p class="footnote"><b>Note:</b> Your private key file is processed locally in the browser and never uploaded.</p>

	</div>

	<script>
		let keyLoaded = false;

		document.getElementById('key').onchange = async (ev) => {
			const file = ev.target.files[0];
			const km = document.querySelector('#km');
			if (file == null) { return; }
			const text = await file.text();
			keyLoaded = await $.setKeyFile(text);
			km.innerHTML = keyLoaded ? '🔑 key loaded' : '👎 not a valid unencrypted OpenSSH Ed25519 private key';
		};

		document.getElementById('btnDecrypt').onclick = (ev) => decryptHandler();

		async function decryptHandler(){
			const eTextEncrypted = document.querySelector('#et');
			const eTextDecrypted = document.querySelector('#dt');
			const eMessage = document.querySelector('#m');

			eMessage.innerHTML = '';

			if (!keyLoaded){
				eMessage.innerHTML = '👎 Load your private key file first';
				eTextDecrypted.value = '';
				return;
			}

			const result = await $.decrypt(eTextEncrypted.value);

			if (result ===  null){
				eMessage.innerHTML = '👎 Decryption failed';
				eTextDecrypted.value = '';
			}else{
				eMessage.innerHTML = '👍 Decrypted';
				eTextDecrypted.value = result
			}
		}
	</script>
</body>
</html>
